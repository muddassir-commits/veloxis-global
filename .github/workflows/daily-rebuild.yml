# Scheduled blog posts (dated in the future) go live on their date at 7:00 AM IST. Runs in GitHub's cloud: no PC needed.
# Every day this lists the posts that are due in content/blog/published.txt; if a new one is due,
# it commits that file to main and Vercel deploys as usual.
# Optional secret VERCEL_DEPLOY_HOOK_URL (Vercel → Project → Settings → Git → Deploy Hooks):
# if set, the Action also calls it, so the post goes live even if Vercel skips the bot's commit.
# It also checks the queue: if fewer than 3 posts are scheduled ahead, it opens a GitHub issue
# "Blog queue running low" (GitHub emails the owner), so publishing never silently stops again.
# Can also be run by hand: Actions → Publish scheduled posts → Run workflow.
name: Publish scheduled posts

on:
  schedule:
    - cron: '31 1 * * *' # 07:01 IST: posts dated today go live at 7 AM IST
    - cron: '0 3 * * *' # 08:30 IST backup (GitHub sometimes delays scheduled runs)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Commit newly due posts
        id: due
        run: |
          added=$(node scripts/blog/publish-due.mjs)
          if git diff --quiet; then echo "No post due today"; echo "added=" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add content/blog/published.txt
          git commit -m "Publish scheduled post: $added"
          for i in 1 2 3; do git push && break; git pull --rebase; done
          echo "added=$added" >> "$GITHUB_OUTPUT"
      - name: Trigger Vercel deploy hook (optional)
        if: steps.due.outputs.added != ''
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "No VERCEL_DEPLOY_HOOK_URL secret; relying on Vercel's Git deploy of the commit"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy hook called"
      - name: Warn when the queue runs low
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ahead=$(node scripts/blog/queue-status.mjs --count)
          echo "Posts scheduled ahead: $ahead"
          title="Blog queue running low"
          open=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          if [ "$ahead" -lt 3 ] && [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "Only $ahead post(s) are scheduled after today. Merge the open 'Blog:' pull requests (the daily writer opens one per day), or ask Claude to write more. Details: \`node scripts/blog/queue-status.mjs\`."
          fi
