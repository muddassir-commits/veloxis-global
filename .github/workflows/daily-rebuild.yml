# Scheduled blog posts (dated in the future) go live on their date.
# Every day at 00:10 IST this lists the posts that are due in content/blog/published.txt;
# if a new one is due, it commits that file to main and Vercel deploys as usual. No secrets needed.
name: Publish scheduled posts

on:
  schedule:
    - cron: '40 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Commit newly due posts
        run: |
          added=$(node scripts/blog/publish-due.mjs)
          if git diff --quiet; then echo "No post due today"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add content/blog/published.txt
          git commit -m "Publish scheduled post: $added"
          git push
