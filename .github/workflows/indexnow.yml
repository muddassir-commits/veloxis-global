# After Vercel finishes a production deploy, ping IndexNow with every sitemap URL
# so Bing (and ChatGPT search / Copilot, which use Bing) pick up changes quickly.
name: IndexNow

on:
  deployment_status:

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/seo/indexnow.mjs
