# Auto-merge blog PRs, so the owner never has to merge them by hand.
# A PR is merged only when ALL of these are true:
#   - its title starts with "Blog:" and its branch starts with "blog/" (what the daily writer opens)
#   - it only touches blog files (posts, blog images, photo markers, blog queue, WhatsApp messages)
#   - npm run blog:check, the TypeScript check and lint all pass
# Anything else (a code change, a failed check) is left open with a comment for the owner.
# Merged posts are NOT live yet: they appear on their own date at 7:00 AM IST (daily-rebuild.yml).
# Can also be run by hand: Actions → Auto-merge blog PRs → Run workflow (merges every open blog PR that passes).
name: Auto-merge blog PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: '0 0 * * *' # 05:30 IST sweep, before the 7 AM publish
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-blog
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check and merge open blog PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          allowed='^(content/blog/|content/blog-queue\.json$|public/images/people/blog/|public/images/blog/|scripts/images/pixabay-used/|data/whatsapp-messages\.ts$)'
          prs=$(gh pr list --state open --json number,title,headRefName,isDraft,isCrossRepository \
            --jq '.[] | select((.title|startswith("Blog:")) and (.headRefName|startswith("blog/")) and (.isDraft|not) and (.isCrossRepository|not)) | .number')
          if [ -z "$prs" ]; then echo "No open blog PRs"; exit 0; fi
          for n in $prs; do
            echo "::group::PR #$n"
            bad=$(gh pr view "$n" --json files --jq '.files[].path' | grep -Ev "$allowed" || true)
            if [ -n "$bad" ]; then
              echo "Not auto-merged, touches non-blog files: $bad"
              gh pr comment "$n" --body "Auto-merge skipped: this PR changes files outside the blog ($(echo $bad | tr '\n' ' ')). The owner must review and merge it." || true
              echo "::endgroup::"; continue
            fi
            git checkout -q --detach origin/main
            gh pr checkout "$n" --force
            if npm run blog:check && npx tsc --noEmit && npm run lint; then
              gh pr merge "$n" --squash --delete-branch && echo "Merged #$n" || echo "Merge of #$n failed (conflict?)"
            else
              gh pr comment "$n" --body "Auto-merge skipped: blog:check, TypeScript or lint failed. See the Actions log." || true
            fi
            git fetch -q origin main
            echo "::endgroup::"
          done
